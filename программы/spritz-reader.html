<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поток — читалка</title>
<style>
:root{color-scheme:dark;--bg:#10141c;--panel:#191f2b;--text:#ecedf4;--muted:#9ba6bb;--accent:#ff6c79}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}small,.hint{color:var(--muted)}.card{background:var(--panel);border:1px solid #30394a;border-radius:20px;padding:24px;margin-top:24px}.viewer{height:220px;position:relative;display:flex;align-items:center;overflow:hidden}.viewer:before,.viewer:after{content:'';position:absolute;left:45%;width:2px;height:24px;background:var(--accent)}.viewer:before{top:25px}.viewer:after{bottom:25px}#word{position:absolute;left:45%;display:flex;align-items:baseline;white-space:nowrap;font:clamp(24px,5vw,48px) ui-monospace,Consolas,monospace}#left{position:absolute;right:100%}#pivot{color:var(--accent)}#right{position:absolute;left:100%}.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}button,.file{border:1px solid #3c475c;background:#242e40;color:var(--text);border-radius:10px;padding:11px 16px;font:inherit;cursor:pointer}button:hover,.file:hover{background:#34415a}#play{background:var(--accent);color:#171923;border-color:var(--accent);min-width:140px;font-weight:700}input[type=range]{accent-color:var(--accent);width:100%}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.row>label{flex:1;min-width:180px}textarea{width:100%;height:200px;background:var(--bg);border:1px solid #3c475c;border-radius:12px;color:var(--text);padding:16px;font:16px/1.6 system-ui;resize:vertical;margin:16px 0}summary{cursor:pointer}#status{min-height:24px;text-align:center;margin:15px 0;color:var(--muted)}.hint{text-align:center;font-size:13px;line-height:1.6}#seek{margin-top:16px}input[type=number]{width:90px;padding:8px;border:1px solid #3c475c;background:var(--bg);color:var(--text);border-radius:8px}label.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:16px}body.light{--bg:#f3f4f8;--panel:#fff;--text:#172033;--muted:#59677c;color-scheme:light}body.light button,body.light .file{background:#e4e8f1;color:#172033}body.light #play{background:var(--accent)}@media(max-width:500px){main{padding:20px 12px}.card{padding:16px}.viewer{height:180px}button{padding:10px 12px}}
</style>
<main>
<header><div><h1>Поток</h1><small>Чтение по одному слову</small></div><button id="theme" title="Сменить тему">Тема</button></header>
<section class="card">
<div class="viewer" aria-label="Область чтения"><div id="word"><span id="left"></span><span id="pivot"></span><span id="right"></span></div></div>
<div class="controls"><button id="back" title="Назад на 10 слов">−10 слов</button><button id="play">Старт</button><button id="next" title="Вперёд на 10 слов">+10 слов</button><button id="reset">Сначала</button></div>
<input id="seek" type="range" min="0" max="0" value="0" aria-label="Позиция чтения">
<div id="status" role="status"></div>
<div class="row"><label>Скорость: <input id="speed" type="number" min="60" max="1200" step="10" value="300"> слов/мин<input id="speedRange" type="range" min="60" max="1200" step="10" value="300" aria-label="Скорость чтения"></label></div>
<label class="check"><input id="pauses" type="checkbox" checked> Увеличивать паузу на знаках препинания и длинных словах</label>
<p class="hint">Пробел — старт / пауза · ← / → — одно слово · Esc — пауза<br>Ваш текст обрабатывается только в браузере, без отправки на сервер.</p>
</section>
<section class="card"><details open><summary>Текст для чтения</summary><textarea id="text" placeholder="Вставьте сюда свой текст…">Вставьте сюда любой текст и нажмите «Применить текст». Настройте удобную скорость. Слова появляются по одному, а выделенная буква остаётся на одном месте. Начинайте медленно и увеличивайте скорость, когда вам комфортно.</textarea><div class="controls"><button id="apply">Применить текст</button><label class="file">Открыть TXT<input id="file" type="file" accept=".txt,text/plain" hidden></label><button id="clear">Очистить</button></div><p class="hint">TXT — в кодировке UTF-8. Позиция, текст и настройки сохраняются локально в этом браузере.</p></details></section>
</main>
<script>
const $=id=>document.getElementById(id);let words=[],pos=0,running=false,timer=null;const key='potok-reader-v1';
function save(){try{localStorage.setItem(key,JSON.stringify({text:$('text').value,pos,speed:$('speed').value,pauses:$('pauses').checked,light:document.body.classList.contains('light')}))}catch(e){}}
function render(){const w=words[pos]||'';const chars=Array.from(w);const n=chars.length;let pivot=n<=1?0:n<=5?1:n<=9?2:n<=13?3:4;pivot=Math.min(pivot,Math.max(0,n-1));$('left').textContent=chars.slice(0,pivot).join('');$('pivot').textContent=chars[pivot]||'—';$('right').textContent=chars.slice(pivot+1).join('');$('seek').max=Math.max(0,words.length-1);$('seek').value=pos;const remaining=Math.ceil(Math.max(0,words.length-pos-1)/Number($('speed').value)*60);$('status').textContent=words.length?`${pos+1} / ${words.length} слов · ${Math.round((pos+1)/words.length*100)}% · осталось ≈ ${Math.floor(remaining/60)} мин ${remaining%60} с`:'Добавьте текст для чтения';$('play').disabled=!words.length;}
function stop(){running=false;clearTimeout(timer);$('play').textContent='Старт';save()}
function delay(){let d=60000/Number($('speed').value);if($('pauses').checked){const w=words[pos]||'';if(/[.!?…][»”"')\]]*$/.test(w))d*=2.4;else if(/[,;:—][»”"')\]]*$/.test(w))d*=1.5;if(w.length>10)d*=1.25;}return d}
function tick(){timer=setTimeout(()=>{if(!running)return;if(pos>=words.length-1){stop();$('play').textContent='Повторить';return}pos++;render();if(pos%20===0)save();tick()},delay())}
function play(){if(running){stop();return}if(!words.length)return;if(pos===words.length-1)pos=0;running=true;$('play').textContent='Пауза';render();tick()}
function move(delta){stop();pos=Math.min(Math.max(0,pos+delta),Math.max(0,words.length-1));render();save()}
function apply(position=0){stop();words=$('text').value.trim().match(/\S+/gu)||[];pos=Math.max(0,Math.min(position,Math.max(0,words.length-1)));render();save()}
function speed(v){v=Math.min(1200,Math.max(60,Number(v)||300));$('speed').value=v;$('speedRange').value=v;render();save();if(running){clearTimeout(timer);tick()}}
$('play').onclick=play;$('back').onclick=()=>move(-10);$('next').onclick=()=>move(10);$('reset').onclick=()=>{stop();pos=0;render();save()};$('apply').onclick=()=>apply();$('clear').onclick=()=>{$('text').value='';apply()};$('seek').oninput=()=>{stop();pos=Number($('seek').value);render();save()};$('speed').onchange=e=>speed(e.target.value);$('speedRange').oninput=e=>speed(e.target.value);$('pauses').onchange=save;$('theme').onclick=()=>{document.body.classList.toggle('light');save()};$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{$('text').value=await f.text();apply()}catch(err){$('status').textContent='Не удалось прочитать файл.'}e.target.value=''};
document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','BUTTON','SUMMARY'].includes(document.activeElement.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='Space'){e.preventDefault();play()}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='Escape')stop()});
let restored=0;try{const s=JSON.parse(localStorage.getItem(key));if(s){$('text').value=s.text||'';restored=s.pos||0;$('speed').value=Math.min(1200,Math.max(60,Number(s.speed)||300));$('speedRange').value=$('speed').value;$('pauses').checked=s.pauses!==false;document.body.classList.toggle('light',!!s.light)}}catch(e){}apply(restored);window.addEventListener('pagehide',save);
</script></html>
