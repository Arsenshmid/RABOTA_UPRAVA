    // Загрузка сохраненных данных
    function loadSavedData() {
        const saved = localStorage.getItem('ntoChecklist');
        if (saved) {
            return JSON.parse(saved);
        }
        return {};
    }

    // Сохранение данных
    function saveData(data) {
        localStorage.setItem('ntoChecklist', JSON.stringify(data));
    }

    // Рендеринг таблицы
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const savedData = loadSavedData();
        
        tbody.innerHTML = '';
        
        ntoData.forEach((nto, index) => {
            const row = document.createElement('tr');
            const isChecked = savedData[index]?.checked || false;
            const notes = savedData[index]?.notes || '';
            
            if (isChecked) {
                row.classList.add('checked');
            }
            
            row.innerHTML = `
                <td><input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck(${index}, this)"></td>
                <td>${index + 1}</td>
                <td><strong>${nto.name}</strong></td>
                <td class="address">${nto.address}</td>
                <td class="phone">${nto.phone}</td>
                <td class="owner">${nto.owner}</td>
                <td><span class="specialization">${nto.spec}</span></td>
                <td class="notes no-print"><input type="text" value="${notes}" placeholder="Заметки..." onchange="updateNotes(${index}, this.value)"></td>
            `;
            
            tbody.appendChild(row);
        });
        
        updateStats();
    }

    // Переключение чекбокса
    function toggleCheck(index, checkbox) {
        const savedData = loadSavedData();
        if (!savedData[index]) {
            savedData[index] = {};
        }
        savedData[index].checked = checkbox.checked;
        saveData(savedData);
        
        const row = checkbox.closest('tr');
        if (checkbox.checked) {
            row.classList.add('checked');
        } else {
            row.classList.remove('checked');
        }
        
        updateStats();
    }

    // Обновление заметок
    function updateNotes(index, value) {
        const savedData = loadSavedData();
        if (!savedData[index]) {
            savedData[index] = {};
        }
        savedData[index].notes = value;
        saveData(savedData);
    }

    // Обновление статистики
    function updateStats() {
        const savedData = loadSavedData();
        const total = ntoData.length;
        const checked = Object.values(savedData).filter(d => d.checked).length;
        const remaining = total - checked;
        
        document.getElementById('total').textContent = total;
        document.getElementById('checked').textContent = checked;
        document.getElementById('remaining').textContent = remaining;
    }

    // Инициализация
    renderTable();
