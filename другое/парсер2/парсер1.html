<!DOCTYPE html>

<meta charset="UTF-8">

<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; display:flex; height:100vh; background:#f4f6f8; }
  #sidebar { width: 380px; background:#fff; border-right:1px solid #ddd; display:flex; flex-direction:column; }
  #sidebar h2 { margin:0; padding:14px; background:#1e3a5f; color:#fff; font-size:16px; }
  #search-box { padding:10px; border-bottom:1px solid #eee; }
  #search { width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; font-size:14px; }
  #filters { display:flex; gap:6px; padding:8px 10px; flex-wrap:wrap; border-bottom:1px solid #eee; }
  .filter-btn { padding:4px 10px; font-size:12px; border:1px solid #ccc; background:#fff; border-radius:12px; cursor:pointer; }
  .filter-btn.active { background:#1e3a5f; color:#fff; border-color:#1e3a5f; }
  #list { flex:1; overflow-y:auto; }
  .item { padding:10px 12px; border-bottom:1px solid #eee; cursor:pointer; font-size:13px; }
  .item:hover { background:#f0f4f8; }
  .item.selected { background:#e3f2fd; border-left:4px solid #1e3a5f; }
  .item .addr { font-weight:600; color:#222; }
  .item .meta { color:#666; font-size:12px; margin-top:3px; }
  .badge { display:inline-block; padding:1px 6px; border-radius:8px; font-size:10px; color:#fff; margin-right:4px; }
  #map { flex:1; }
  #modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
  #modal-bg.show { display:flex; }
  #modal { background:#fff; padding:20px; border-radius:8px; width:420px; max-width:90%; }
  #modal h3 { margin-top:0; }
  #modal textarea { width:100%; height:100px; padding:8px; border:1px solid #ccc; border-radius:4px; font-family:inherit; }
  #modal .btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  #modal button { padding:6px 14px; border:none; border-radius:4px; cursor:pointer; }
  .btn-save { background:#1e3a5f; color:#fff; }
  .btn-cancel { background:#eee; }
  .legend { background:#fff; padding:10px; border-radius:4px; line-height:1.8; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.2); }
  .legend i { display:inline-block; width:12px; height:12px; margin-right:6px; border-radius:50%; vertical-align:middle; }
  .status-terminated { color:#c00; font-weight:600; }
  .status-active { color:#080; }
  .status-auction { color:#c70; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>НТО Автодорожного округа</h2>
  <div id="search-box">
    <input id="search" type="text" placeholder="Поиск: адрес, владелец, специализация...">
  </div>
  <div id="filters">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="active">Действующие</button>
    <button class="filter-btn" data-filter="terminated">Расторгнутые</button>
    <button class="filter-btn" data-filter="auction">На аукцион</button>
  </div>
  <div id="list"></div>
</div>

<div id="map"></div>

<div id="modal-bg">
  <div id="modal">
    <h3 id="modal-title">Редактирование</h3>
    <p id="modal-addr" style="color:#666;font-size:13px;"></p>
    <label>Статус:</label>
    <select id="modal-status" style="width:100%;padding:6px;margin:6px 0;">
      <option value="active">Действует</option>
      <option value="terminated">Расторгнут</option>
      <option value="auction">На аукцион</option>
    </select>
    <label>Описание / заметки:</label>
    <textarea id="modal-note" placeholder="Ваши пометки..."></textarea>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="btn-save" onclick="saveModal()">Сохранить</button>
    </div>
  </div>
</div>

// === СОХРАНЕННЫЕ ПОЛЬЗОВАТЕЛЬСКИЕ ДАННЫЕ ===
let userNotes = JSON.parse(localStorage.getItem('nto_notes') || '{}');

// === ИНИЦИАЛИЗАЦИЯ КАРТЫ ===
const map = L.map('map').setView([62.015, 129.690], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OSM', maxZoom:19
}).addTo(map);

// Спутник (переключение)
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution:'© Esri', maxZoom:19
});
L.control.layers({"Схема":L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map), "Спутник":satellite}, null, {position:'topright'}).addTo(map);

// Граница округа
L.polygon(districtBorder, {color:"#1e3a5f", weight:2, fillOpacity:0.05, dashArray:"5,5"}).addTo(map).bindTooltip("Автодорожный округ");

// === МАРКЕРЫ ===
const markers = {};
nto_data.forEach(obj => {
  const status = obj.status || (userNotes[obj.id]?.status) || 'active';
  const color = getColor(obj.spec);
  const marker = L.circleMarker([obj.lat, obj.lon], {
    radius: 8, fillColor: color, color: status==='terminated'?'#c00':(status==='auction'?'#c70':'#fff'),
    weight: status==='active'?1:2, fillOpacity: 0.85
  }).addTo(map);

  const note = userNotes[obj.id]?.note || '';
  const contract = obj.contract || '';
  marker.bindPopup(`
    <div style="min-width:220px;">
      <b>№${obj.id}. ${obj.addr}</b><br>
      <span style="color:${color};">● ${obj.spec}</span><br>
      Площадь: ${obj.area} м² | Тип: ${obj.type}<br>
      ${obj.owner ? `Владелец: ${obj.owner}<br>`:''}
      ${contract ? `Договор: ${contract}<br>`:''}
      ${note ? `<hr style="margin:6px 0;"><em>Заметка:</em> ${note}<br>`:''}
      <button onclick="openModal(${obj.id})" style="margin-top:6px;padding:4px 10px;background:#1e3a5f;color:#fff;border:none;border-radius:3px;cursor:pointer;">Редактировать</button>
    </div>
  `);
  marker.on('click', () => selectItem(obj.id));
  markers[obj.id] = marker;
});

// === ЛЕГЕНДА ===
const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','legend');
  div.innerHTML = '<b>Специализация</b><br>' +
    Object.entries(specColors).slice(0,8).map(([k,v])=>`<i style="background:${v}"></i>${k}`).join('<br>');
  return div;
};
legend.addTo(map);

// === СПИСОК В БОКОВОЙ ПАНЕЛИ ===
let currentFilter = 'all';
let currentSearch = '';

function renderList(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  nto_data.forEach(obj => {
    const status = obj.status || userNotes[obj.id]?.status || 'active';
    if(currentFilter !== 'all' && status !== currentFilter) return;
    const q = currentSearch.toLowerCase();
    if(q && !(obj.addr.toLowerCase().includes(q) || obj.spec.toLowerCase().includes(q) || (obj.owner||'').toLowerCase().includes(q))) return;

    const div = document.createElement('div');
    div.className = 'item';
    div.dataset.id = obj.id;
    const statusLabel = status==='terminated'?'<span class="status-terminated">расторгнут</span>':(status==='auction'?'<span class="status-auction">аукцион</span>':'<span class="status-active">действует</span>');
    div.innerHTML = `
      <div class="addr"><span class="badge" style="background:${getColor(obj.spec)}">${obj.id}</span>${obj.addr}</div>
      <div class="meta">${obj.spec} · ${obj.area} м² · ${statusLabel}</div>
      ${obj.owner?`<div class="meta">${obj.owner}</div>`:''}
    `;
    div.onclick = () => { selectItem(obj.id); map.setView([obj.lat, obj.lon], 16); markers[obj.id].openPopup(); };
    list.appendChild(div);
  });
}
renderList();

function selectItem(id){
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('selected', +el.dataset.id === id));
}

// === ПОИСК И ФИЛЬТРЫ ===
document.getElementById('search').oninput = e => { currentSearch = e.target.value; renderList(); };
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  };
});

// === МОДАЛКА РЕДАКТИРОВАНИЯ ===
let editingId = null;
function openModal(id){
  editingId = id;
  const obj = nto_data.find(o=>o.id===id);
  document.getElementById('modal-title').textContent = `Объект №${id}`;
  document.getElementById('modal-addr').textContent = obj.addr;
  document.getElementById('modal-status').value = userNotes[id]?.status || obj.status || 'active';
  document.getElementById('modal-note').value = userNotes[id]?.note || '';
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); editingId=null; }
function saveModal(){
  if(!userNotes[editingId]) userNotes[editingId] = {};
  userNotes[editingId].status = document.getElementById('modal-status').value;
  userNotes[editingId].note = document.getElementById('modal-note').value;
  localStorage.setItem('nto_notes', JSON.stringify(userNotes));
  // перерисовка маркера
  const obj = nto_data.find(o=>o.id===editingId);
  const st = userNotes[editingId].status;
  markers[editingId].setStyle({
    color: st==='terminated'?'#c00':(st==='auction'?'#c70':'#fff'),
    weight: st==='active'?1:2
  });
  closeModal();
  renderList();
  markers[editingId].openPopup();
}
</script>
