  .status-active { background:#2e7d32; }
  .status-terminated { background:#c62828; }
  .status-auction { background:#ef6c00; }
  .status-dispute { background:#6a1b9a; }
  .status-pending { background:#1565c0; }

  .card { background:#fff; border-radius:8px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); cursor:pointer; border-left:4px solid #1e3a5f; transition:transform .1s, box-shadow .1s; }

  .card .card-addr { font-weight:600; font-size:14px; margin-bottom:6px; }
  .card .card-meta { font-size:12px; color:#666; line-height:1.6; }
  .card .card-meta b { color:#333; }

// === АВТОМАТИЧЕСКИЙ СТАТУС ===
function getStatus(o){
  const c = (o.contract||'').toLowerCase();
  const n = (o.note||'').toLowerCase();
  if(c.includes('расторг') && n.includes('аукцион')) return 'auction';
  if(c.includes('расторг')) return 'terminated';
  if(n.includes('аукцион')) return 'auction';
  if(n.includes('судебн')) return 'dispute';
  if(n.includes('расторжени')) return 'pending';
  if(n.includes('заявлен')) return 'pending';
  return 'active';
}
nto.forEach(o => o.status = getStatus(o));

// === ЦВЕТА СПЕЦИАЛИЗАЦИЙ ===
const specColors = {
  "Продукты":"#2e7d32","Хлеб и продукты":"#388e3c","Продукты (Теплая остановка)":"#43a047","Яйцо":"#558b2f",
  "Фрукты-овощи":"#ef6c00","Розлив воды":"#1565c0","Общепит":"#c62828",
  "Автосервис":"#546e7a","Автозапчасти":"#607d8b","Шиномонтаж":"#78909c",
  "Теплая остановка":"#f9a825","Местные товары":"#6a1b9a","Цветы":"#ad1457",
  "Газовое оборудование":"#455a64"
};
function getColor(s){ return specColors[s] || "#888"; }

const statusLabels = {
  active:{t:"Действует", c:"#2e7d32"},
  terminated:{t:"Расторгнут", c:"#c62828"},
  auction:{t:"На аукцион", c:"#ef6c00"},
  dispute:{t:"Судебный спор", c:"#6a1b9a"},
  pending:{t:"Под расторжение / заявление", c:"#1565c0"}
};

// === ЗАПОЛНЕНИЕ ФИЛЬТРА СПЕЦИАЛИЗАЦИЙ ===
const specs = [...new Set(nto.map(o=>o.spec))].sort();
const specSel = document.getElementById('filter-spec');
specs.forEach(s => { const opt = document.createElement('option'); opt.value=s; opt.textContent=s; specSel.appendChild(opt); });

// === РЕНДЕР ===
let currentView = 'table';
let selectedId = null;

function filterData(){
  const q = document.getElementById('search').value.toLowerCase().trim();
  const fs = document.getElementById('filter-spec').value;
  const fst = document.getElementById('filter-status').value;
  const ft = document.getElementById('filter-type').value;
  return nto.filter(o => {
    if(fs && o.spec !== fs) return false;
    if(fst && o.status !== fst) return false;
    if(ft && o.type !== ft) return false;
    if(!q) return true;
    const hay = `${o.id} ${o.addr} ${o.owner} ${o.spec} ${o.contract} ${o.note} ${o.type}`.toLowerCase();
    return hay.includes(q);
  });
}

function render(){
  const data = filterData();
  document.getElementById('stat-shown').textContent = data.length;
  const totalArea = data.reduce((s,o)=>s+o.area,0).toFixed(1);
  
  const content = document.getElementById('content');
  if(data.length === 0){
    content.innerHTML = '<div class="empty"><b>Ничего не найдено</b>Попробуйте изменить параметры поиска или сбросить фильтры.</div>';
    return;
  }
  
  if(currentView === 'table'){
    content.innerHTML = `
      <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:40px">№</th>
          <th>Местонахождение</th>
          <th>Площадь</th>
          <th>Владелец</th>
          <th>Специализация</th>
          <th>Срок</th>
          <th>Статус</th>
        </tr></thead>
        <tbody>
          ${data.map(o => {
            const st = statusLabels[o.status];
            return `<tr class="row ${selectedId===o.id?'selected':''}" onclick="openModal(${o.id})">
              <td class="num">${o.id}</td>
              <td class="addr-cell">${o.addr}</td>
              <td>${o.area} м²</td>
              <td>${o.owner || '—'}</td>
              <td><span class="spec-badge" style="background:${getColor(o.spec)}">${o.spec}</span></td>
              <td>${o.term || '—'}</td>
              <td><span class="status-dot" style="background:${st.c}"></span>${st.t}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>`;
  } else {
    content.innerHTML = `<div class="cards">${data.map(o => {
      const st = statusLabels[o.status];
      return `<div class="card" style="border-left-color:${st.c}" onclick="openModal(${o.id})">
        <div class="card-head">
          <span class="card-num">№ ${o.id}</span>
          <span class="spec-badge" style="background:${getColor(o.spec)}">${o.spec}</span>
        </div>
        <div class="card-addr">${o.addr}</div>
        <div class="card-meta">
          <b>Площадь:</b> ${o.area} м²<br>
          <b>Владелец:</b> ${o.owner || '—'}<br>
          <b>Срок:</b> ${o.term || 'не указан'}<br>
          <span class="status-dot" style="background:${st.c}"></span><b style="color:${st.c}">${st.t}</b>
        </div>
      </div>`;
    }).join('')}</div>`;
  }
}

function setView(v){
  currentView = v;
  document.getElementById('view-table').classList.toggle('active', v==='table');
  document.getElementById('view-cards').classList.toggle('active', v==='cards');
  render();
}

// === МОДАЛКА ===
function openModal(id){
  const o = nto.find(x=>x.id===id);
  if(!o) return;
  selectedId = id;
  const st = statusLabels[o.status];
  document.getElementById('modal-title').textContent = `Объект № ${o.id}`;
  document.getElementById('modal-body').innerHTML = `
    <div class="detail-grid">
      <div class="detail-row full">
        <div class="detail-label">Местонахождение</div>
        <div class="detail-value" style="font-weight:600;font-size:15px;">${o.addr}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Площадь объекта</div>
        <div class="detail-value mono">${o.area} м²</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Торговая площадь</div>
        <div class="detail-value mono">${o.tradeArea} м²</div>
      </div>
      <div class="detail-row full">
        <div class="detail-label">Владелец / пользователь</div>
        <div class="detail-value">${o.owner || '—'}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Вид объекта</div>
        <div class="detail-value">${o.type}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">Вид торговли</div>
        <div class="detail-value">${o.trade}</div>
      </div>
      <div class="detail-row full">
        <div class="detail-label">Специализация</div>
        <div class="detail-value"><span class="spec-badge" style="background:${getColor(o.spec)}">${o.spec}</span></div>
      </div>
      <div class="detail-row full">
        <div class="detail-label">Срок размещения</div>
        <div class="detail-value mono">${o.term || 'не указан'}</div>
      </div>
      <div class="detail-row full">
        <div class="detail-label">Условия / договор</div>
        <div class="detail-value mono">${o.contract || '—'}</div>
      </div>
      <div class="detail-row full">
        <div class="detail-label">Статус</div>
        <div class="detail-value"><span class="status-dot" style="background:${st.c}"></span><b style="color:${st.c}">${st.t}</b></div>
      </div>
      ${o.note ? `<div class="detail-row full"><div class="detail-label">Примечание</div><div class="note-box">${o.note}</div></div>` : ''}
      ${o.hand ? `<div class="detail-row full"><div class="detail-label">Рукописная пометка в оригинале</div><div class="handwritten">${o.hand}</div></div>` : ''}
      <div class="detail-row full" style="margin-top:10px;">
        <div class="detail-label">Собственник земельного участка</div>
        <div class="detail-value">ГО «город Якутск»</div>
      </div>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('show');
  render();
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); selectedId=null; render(); }

// === СОБЫТИЯ ===
document.getElementById('search').oninput = render;
document.getElementById('filter-spec').onchange = render;
document.getElementById('filter-status').onchange = render;
document.getElementById('filter-type').onchange = render;

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

render();
</script>
